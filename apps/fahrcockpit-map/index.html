<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#122c2e">
  <meta name="description" content="Eigenständiger schlüsselfreier Kartenbereich für FahrCockpit; keine Abbiegenavigation.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/app.svg">
  <link rel="stylesheet" href="./vendor/leaflet.css">
  <link rel="stylesheet" href="./styles.css">
  <title>FahrCockpit · Integrierte Karte</title>
  <script defer src="./vendor/leaflet.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <main class="map-shell">
    <header class="toolbar">
      <div class="brand"><strong>FahrCockpit</strong><small>OSM-Karte · keine Abbiegenavigation</small></div>
      <div class="controls">
        <button type="button" id="osm" aria-label="Schlüsselfreie Karte anzeigen" title="OpenStreetMap">OSM</button>
        <button type="button" id="google" hidden aria-label="Optionale Google-Demokarte" title="Google-Demokarte">G</button>
        <button type="button" id="center" aria-label="Auf meinen Standort zentrieren" title="Mein Standort">⌖</button>
        <button type="button" id="settings" aria-label="Optionale Karteneinstellungen" title="Einstellungen">⚙</button>
      </div>
    </header>
    <section class="map-surface" aria-label="Interaktive Karte">
      <div id="osm-map" role="application" aria-label="Schlüsselfreie OpenStreetMap-Karte"></div>
      <div id="google-map" hidden aria-label="Optionale Google-Karte"></div>
    </section>
    <footer class="footer"><span id="status" role="status" aria-live="polite">OpenStreetMap wird geladen …</span></footer>
    <section class="settings-panel" id="settings-panel" hidden aria-label="Optionale Google-Demokarte einrichten">
      <form id="key-form">
        <h2>Kartenquelle</h2>
        <p><strong>OpenStreetMap funktioniert ohne Schlüssel.</strong> Google ist ausschließlich für einen optionalen Prototypentest verfügbar; keine Pflicht zur Einrichtung und keine Abbiegenavigation.</p>
        <label for="key">Google Maps Demo Key (optional)</label>
        <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="Optionaler Demo-Schlüssel" inputmode="text" maxlength="110">
        <div class="actions">
          <button type="submit">Google testen</button>
          <button type="button" id="forget" class="secondary">Google-Key löschen</button>
          <button type="button" id="close" class="secondary">Schließen</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
