name: 'App-Fabrik: Android pruefen (wiederverwendbar)'
on:
  workflow_call:
    inputs:
      project_path:
        required: true
        type: string
      module:
        required: true
        type: string
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Pfade und Modul pruefen
        shell: bash
        env:
          PROJECT: ${{ inputs.project_path }}
          MODULE: ${{ inputs.module }}
        run: |
          set -euo pipefail
          [[ "$PROJECT" =~ ^[a-zA-Z0-9_./-]+$ ]] || exit 1
          [[ "$MODULE" =~ ^[a-zA-Z0-9_-]+$ ]] || exit 1
          [[ "$PROJECT" != /* && "$PROJECT" != *..* ]] || exit 1
          test -f "$PROJECT/settings.gradle" -o -f "$PROJECT/settings.gradle.kts"
          test -d "$PROJECT/$MODULE"
      - name: Gradle Unit-Tests, Lint und Debug-APK
        shell: bash
        env:
          PROJECT: ${{ inputs.project_path }}
          MODULE: ${{ inputs.module }}
        run: |
          set -euo pipefail
          gradle --no-daemon -p "$PROJECT" \
            ":$MODULE:testDebugUnitTest" ":$MODULE:lintDebug" ":$MODULE:assembleDebug"
      - name: Debug-APK als CI-Artefakt (nicht fuer Updates)
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.module }}-debug-${{ github.run_id }}
          path: ${{ inputs.project_path }}/${{ inputs.module }}/build/outputs/apk/debug/*-debug.apk
          if-no-files-found: error
          retention-days: 7
