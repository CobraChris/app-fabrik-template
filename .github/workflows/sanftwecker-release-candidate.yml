name: "Sanftwecker: signierte Beta automatisch bereitstellen"

# Only a reviewed main-branch owner push changing this ONE request can issue a release.
# The beta source stays in its separate draft PR until Samsung acceptance.
on:
  push:
    branches: [main]
    paths: ['requests/sanftwecker-release.json']

permissions:
  contents: read

concurrency:
  group: signed-sanftwecker-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'CobraChris/app-fabrik-template' && github.actor == 'CobraChris' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.request.outputs.source_sha }}
      version_code: ${{ steps.request.outputs.version_code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Nur geprüften Sanftwecker-Commit auf main freigeben
        id: request
        env:
          REQUEST_BEFORE: ${{ github.event.before }}
        run: node scripts/sanftwecker-release-request.mjs

  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      version_name: ${{ steps.metadata.outputs.version_name }}
    steps:
      - name: Exakt freigegebenen Beta-Stand laden (ohne Schreibberechtigung)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDK"
          "$SDK" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - name: Tests, Lint und unsignierte Android-Release-APK (ohne Secrets)
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p experiments/watch-vibration-poc \
            :alarm:testDebugUnitTest :alarm:lintDebug :alarm:assembleRelease
      - name: Echte APK-Metadaten und erwarteten Versionscode prüfen
        id: metadata
        shell: bash
        env:
          EXPECTED_CODE: ${{ needs.validate.outputs.version_code }}
        run: |
          set -euo pipefail
          FILE=experiments/watch-vibration-poc/alarm/build/outputs/apk/release/output-metadata.json
          python3 - "$FILE" "$EXPECTED_CODE" "$GITHUB_OUTPUT" <<'PY'
          import json,sys,re
          filename,expected,output=sys.argv[1:]
          with open(filename,encoding='utf8') as f: data=json.load(f)
          assert data['applicationId']=='com.cobrachris.sanftwecker', 'wrong Android package ID'
          elements=data.get('elements',[])
          assert len(elements)==1, 'expected exactly one APK'
          item=elements[0]
          assert str(item.get('versionCode'))==expected, 'unexpected versionCode'
          name=item.get('versionName')
          assert isinstance(name,str) and re.fullmatch(r'[0-9a-zA-Z_.-]{1,64}',name)
          assert item.get('outputFile')=='alarm-release-unsigned.apk', 'unexpected APK output'
          with open(output,'a',encoding='utf8') as f: f.write('version_name='+name+'\n')
          PY
          test -s experiments/watch-vibration-poc/alarm/build/outputs/apk/release/alarm-release-unsigned.apk
          cp experiments/watch-vibration-poc/alarm/build/outputs/apk/release/alarm-release-unsigned.apk unsigned-sanftwecker.apk
      - name: Nur die unsignierte APK für geschützten Job übergeben
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sanftwecker-unsigned-for-signing
          path: unsigned-sanftwecker.apk
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: [validate,build]
    if: needs.validate.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    environment: android-releases
    steps:
      - name: Unsigned-APK aus demselben Workflow laden
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sanftwecker-unsigned-for-signing
          path: unsigned
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android Signing Build Tools bereitstellen
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDK"
          "$SDK" 'build-tools;35.0.0' >/dev/null
      - name: Dauerhaften KeyStore nur in diesem Schritt signierend verwenden
        shell: bash
        env:
          STORE_B64: ${{ secrets.APP_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.APP_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APP_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APP_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STORE_B64" && test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          test -s unsigned/unsigned-sanftwecker.apk
          umask 077
          printf '%s' "$STORE_B64" | base64 --decode > "$RUNNER_TEMP/android-signing-key.p12"
          keytool -list -keystore "$RUNNER_TEMP/android-signing-key.p12" \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          mkdir -p signed
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/android-signing-key.p12" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out signed/sanftwecker-release.apk unsigned/unsigned-sanftwecker.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --min-sdk-version 30 --verbose --print-certs signed/sanftwecker-release.apk \
            > signed/certificate-details.txt
          (cd signed && sha256sum sanftwecker-release.apk > SHA256SUMS.txt)
      - name: Keine Downgrades oder Zertifikatswechsel zulassen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CODE: ${{ needs.validate.outputs.version_code }}
        run: |
          set -euo pipefail
          TAG="sanftwecker-v$EXPECTED_CODE"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release-Tag $TAG already exists"
            exit 1
          fi
          MAX="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            | jq -r '[.[].tagName | select(test("^sanftwecker-v[0-9]+$")) | split("-v")[-1] | tonumber] | max // 0')"
          if [ "$MAX" -gt 0 ]; then
            if [ "$EXPECTED_CODE" -le "$MAX" ]; then
              echo "::error::Refusing Android versionCode downgrade"
              exit 1
            fi
            mkdir -p previous
            gh release download "sanftwecker-v$MAX" --repo "$GITHUB_REPOSITORY" \
              --pattern 'sanftwecker-release.apk' --dir previous
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
              --print-certs previous/sanftwecker-release.apk > previous/cert.txt
            grep -m1 'Signer #1 certificate SHA-256 digest:' \
              previous/cert.txt | awk -F': ' '{print $2}' > previous/fingerprint
            grep -m1 'Signer #1 certificate SHA-256 digest:' \
              signed/certificate-details.txt | awk -F': ' '{print $2}' > signed/fingerprint
            test -s previous/fingerprint && test -s signed/fingerprint
            if ! cmp -s previous/fingerprint signed/fingerprint; then
              echo "::error::Signer certificate differs from previous update"
              exit 1
            fi
          fi
      - name: Signierte Beta-APK und Prüfsumme veröffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ needs.validate.outputs.version_code }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          set -euo pipefail
          TAG="sanftwecker-v$VERSION_CODE"
          cat > signed/RELEASE_INFO.txt <<EOF
          App: Sanftwecker (Test)
          Package: com.cobrachris.sanftwecker
          Version: $VERSION_NAME
          Android versionCode: $VERSION_CODE
          Reviewed source commit: $SOURCE_SHA
          Signing: stable per-app GitHub Actions signing identity
          EOF
          gh release create "$TAG" \
            signed/sanftwecker-release.apk signed/SHA256SUMS.txt signed/RELEASE_INFO.txt \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "Sanftwecker $VERSION_NAME (signierte Testversion)" \
            --notes "Signierte Samsung-Testversion. Nur mit geprüftem Versionscode und Zertifikat. Bis zur Geräteabnahme den bisherigen Wecker behalten." \
            --prerelease
      - name: Keystore auf Runner entfernen
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/android-signing-key.p12"
