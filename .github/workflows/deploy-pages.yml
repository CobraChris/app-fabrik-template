name: PWA veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5
      - name: Nur die Website hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
