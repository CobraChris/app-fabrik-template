name: Chat-Link-Öffner APK (nur PR)

on:
  pull_request:
    paths:
      - 'prototypes/chatgpt-link-opener/**'
      - '.github/workflows/chat-link-opener-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repository ohne persistierte GitHub-Zugangsdaten auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Java 17 installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9 bereitstellen
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35 installieren
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Debug APK erstellen
        working-directory: prototypes/chatgpt-link-opener
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Zertifikatsfingerabdruck direkt aus APK ermitteln
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          mkdir -p verification-output
          APK="prototypes/chatgpt-link-opener/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$APK"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" > verification-output/apk-certs.txt
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          text = Path('verification-output/apk-certs.txt').read_text()
          match = re.search(r'certificate SHA-256 digest:\s*([0-9A-Fa-f]{64})', text)
          if not match:
              raise SystemExit('Der APK-Zertifikatsfingerabdruck wurde nicht gefunden.')
          raw = match.group(1).upper()
          fingerprint = ':'.join(raw[i:i+2] for i in range(0, len(raw), 2))
          Path('verification-output/cert-sha256.txt').write_text(fingerprint + '\n')
          document = [{
              'relation': ['delegate_permission/common.handle_all_urls'],
              'target': {
                  'namespace': 'android_app',
                  'package_name': 'io.github.cobrachris.chatlinkopener',
                  'sha256_cert_fingerprints': [fingerprint]
              }
          }]
          Path('verification-output/assetlinks.json').write_text(json.dumps(document, indent=2) + '\n')
          PY
      - name: APK und passende Verifizierungsdatei speichern
        uses: actions/upload-artifact@v4
        with:
          name: chat-link-opener-android-debug
          if-no-files-found: error
          retention-days: 7
          path: |
            prototypes/chatgpt-link-opener/app/build/outputs/apk/debug/app-debug.apk
            verification-output/assetlinks.json
            verification-output/cert-sha256.txt

# Sicherheit: kein push, kein workflow_dispatch, keine Secrets, nur contents:read.
# Dieser Workflow erzeugt eine DEBUG-APK mit einem temporären Signaturzertifikat.
# Nach einem neuen Build passt die alte assetlinks.json möglicherweise nicht mehr.
