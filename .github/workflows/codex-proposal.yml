name: Codex Änderung vorschlagen (manuell)

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Was soll Codex verändern? Ohne Zugangsdaten eingeben.'
        required: false
        type: string
      issue_number:
        description: 'Statt Freitext: Nummer eines offenen GitHub Issues'
        required: false
        type: string

permissions:
  contents: read

jobs:
  propose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Quellcode ohne Token auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Issue oder Freitext als sichere Auftragsdatei vorbereiten
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TASK_TEXT: ${{ inputs.task }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: node scripts/prepare-codex-task.mjs
      - name: Codex bearbeitet das Projekt isoliert
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          prompt-file: codex-task.md
      - name: Änderungspatch erzeugen
        shell: bash
        run: |
          set -euo pipefail
          git add -N -- site tests README.md app.config.json
          git diff --binary -- site tests README.md app.config.json > proposed.patch
          if [[ ! -s proposed.patch ]]; then
            echo 'Keine Änderungen gefunden.' >&2
            exit 1
          fi
      - name: Patch als Artefakt übergeben
        uses: actions/upload-artifact@v4
        with:
          name: codex-proposal
          path: proposed.patch
          retention-days: 3
          if-no-files-found: error

  open-pr:
    needs: propose
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Unveränderte Hauptversion laden
        uses: actions/checkout@v4
      - name: Änderungspatch herunterladen
        uses: actions/download-artifact@v4
        with:
          name: codex-proposal
      - name: Änderungen anwenden und separaten Branch veröffentlichen
        shell: bash
        env:
          TASK: ${{ inputs.task }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git apply --check -- proposed.patch
          git apply -- proposed.patch
          BRANCH="codex/proposal-${RUN_ID}"
          git switch -c "$BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site tests README.md app.config.json
          if git diff --cached --quiet; then
            echo 'Keine Änderungen zu committen.' >&2
            exit 1
          fi
          git commit -m 'Codex: Änderungsvorschlag'
          git push --set-upstream origin "$BRANCH"
          if [[ -n "$ISSUE_NUMBER" ]]; then
            printf '### Auftrag\n\nReferenz: Issue #%s\n\n' "$ISSUE_NUMBER" > pr-body.md
          else
            printf '### Auftrag\n\n%s\n\n' "$TASK" > pr-body.md
          fi
          printf '### Sicherheit\n\nAutomatischer Vorschlag. Bitte Code, Tests und Berechtigungen prüfen. Kein Auto-Merge.\n' >> pr-body.md
          gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "Codex-Vorschlag #${RUN_ID}" --body-file pr-body.md
