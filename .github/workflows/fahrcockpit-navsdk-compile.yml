name: FahrCockpit – optionale Google Navigation SDK Kompilierung (OHNE Billing)

on:
  push:
    branches: [feature/fahrcockpit-v20-integrated-navigation-gated, feature/fahrcockpit-blitzer-bridge, feature/fahrcockpit-v21-google-first-fallback, fix/fahrcockpit-v22-keyboard-insets-layout]
    paths:
      - 'experiments/fahrcockpit/**'
      - 'tests/fahrcockpit-contract.test.mjs'
      - '.github/workflows/fahrcockpit-navsdk-compile.yml'

permissions:
  contents: read

jobs:
  navigation-sdk-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: FahrCockpit Vertrags- und Sicherheitsregressionen
        run: node --test tests/fahrcockpit-contract.test.mjs
      - name: Android API 36 fuer NavSDK bereitstellen
        shell: bash
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - name: Bestehendes v19-Releasezertifikat fuer Android-API-Key ermitteln
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fahrcockpit-v19-cert"
          gh release download fahrcockpit-v19 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'fahrcockpit-release.apk' \
            --dir "$RUNNER_TEMP/fahrcockpit-v19-cert"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          test -s "$RUNNER_TEMP/fahrcockpit-v19-cert/fahrcockpit-release.apk"
          test -n "$apksigner_path"
          echo "FahrCockpit Signatur mit vorhandenem Android-Build-Tool pruefen"
          "$apksigner_path" verify --print-certs \
            "$RUNNER_TEMP/fahrcockpit-v19-cert/fahrcockpit-release.apk" \
            > "$RUNNER_TEMP/fahrcockpit-v19-cert/certificate.txt"
          echo "Oeffentliche Zertifikatpruefung (SHA-1):"
          grep -i -E 'SHA-1|SHA1' "$RUNNER_TEMP/fahrcockpit-v19-cert/certificate.txt" || true
          sha1="$(sed -nE 's/.*certificate SHA-1 digest:[[:space:]]*([0-9a-fA-F:]{40,59}).*/\1/p' \
            "$RUNNER_TEMP/fahrcockpit-v19-cert/certificate.txt" | head -n 1 | tr -d ':')"
          if [[ ! "$sha1" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Unerwartetes SHA-1-Ausgabeformat, kein Key erstellt."; exit 1
          fi
          colon_sha1="$(printf '%s' "$sha1" | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g;s/:$//')"
          echo "Android-Paketname: com.cobrachris.fahrcockpit"
          echo "Original-v19-Zertifikat SHA-1 (Google Cloud Android-Einschraenkung): $colon_sha1"
          echo "Nur oeffentlicher Zertifikat-Fingerabdruck; kein Signierschluessel ausgegeben."
      - name: Google Navigation SDK ohne Key/Cloud testen
        shell: bash
        env:
          FAHRCOCKPIT_NAV_SDK_KEY: ''
        run: |
          set -euo pipefail
          gradle --no-daemon -p experiments/fahrcockpit -PwithGoogleNavSdk=true -PgoogleOnly=true \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
      - name: Verhindern, dass SDK-Schluessel im Repo steht
        shell: bash
        run: |
          set -euo pipefail
          test -z "${FAHRCOCKPIT_NAV_SDK_KEY:-}"
          grep -q "orElse('false')" experiments/fahrcockpit/app/build.gradle
          grep -q "FAHRCOCKPIT_NAV_SDK_KEY" experiments/fahrcockpit/app/build.gradle

      - name: Google-only release candidate package check
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p='experiments/fahrcockpit/app/build/outputs/apk/release/output-metadata.json'
          with open(p,encoding='utf-8') as f: meta=json.load(f)
          assert meta['applicationId']=='com.cobrachris.fahrcockpit'
          assert meta['elements'][0]['versionCode']==22
          assert meta['elements'][0]['outputFile']=='app-release-unsigned.apk'
          print('Verified: Google-only v22 original package, unsigned, no API key.')
          PY
