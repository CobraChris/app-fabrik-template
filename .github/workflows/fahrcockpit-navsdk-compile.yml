name: FahrCockpit – optionale Google Navigation SDK Kompilierung (OHNE Billing)

on:
  push:
    branches: [feature/fahrcockpit-v20-integrated-navigation-gated, feature/fahrcockpit-blitzer-bridge]
    paths:
      - 'experiments/fahrcockpit/**'
      - '.github/workflows/fahrcockpit-navsdk-compile.yml'

permissions:
  contents: read

jobs:
  navigation-sdk-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: FahrCockpit Vertrags- und Sicherheitsregressionen
        run: node --test tests/fahrcockpit-contract.test.mjs
      - name: Android API 36 fuer NavSDK bereitstellen
        shell: bash
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - name: Google Navigation SDK ohne Key/Cloud testen
        shell: bash
        env:
          FAHRCOCKPIT_NAV_SDK_KEY: ''
        run: |
          set -euo pipefail
          gradle --no-daemon -p experiments/fahrcockpit -PwithGoogleNavSdk=true \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verhindern, dass SDK-Schluessel im Repo steht
        shell: bash
        run: |
          set -euo pipefail
          test -z "${FAHRCOCKPIT_NAV_SDK_KEY:-}"
          grep -q "orElse('false')" experiments/fahrcockpit/app/build.gradle
          grep -q "FAHRCOCKPIT_NAV_SDK_KEY" experiments/fahrcockpit/app/build.gradle
