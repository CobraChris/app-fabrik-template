name: FahrCockpit - OSM Fallback Keyless Compile

on:
  push:
    branches: [feature/fahrcockpit-v21-google-first-fallback]
    paths:
      - 'experiments/fahrcockpit/**'
      - 'tests/fahrcockpit-contract.test.mjs'
      - '.github/workflows/fahrcockpit-osm-compile.yml'

permissions:
  contents: read

jobs:
  osm-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Contract regression tests
        run: node --test tests/fahrcockpit-contract.test.mjs
      - name: Android API 36
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - name: Offline BRouter route and MapLibre app compile (no key)
        env:
          FAHRCOCKPIT_NAV_SDK_KEY: ''
        run: |
          set -euo pipefail
          gradle --no-daemon -p experiments/fahrcockpit -PwithOsmFallback=true :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Combined Google-first plus OSM fallback variant compile (no key, no billing)
        env:
          FAHRCOCKPIT_NAV_SDK_KEY: ''
        run: |
          set -euo pipefail
          gradle --no-daemon -p experiments/fahrcockpit \
            -PwithGoogleNavSdk=true -PwithOsmFallback=true \
            :app:assembleDebug
