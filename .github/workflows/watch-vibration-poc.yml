name: Android: Sanftwecker + Watch-Benachrichtigungstests

on:
  pull_request:
    paths:
      - 'experiments/watch-vibration-poc/**'
      - '.github/workflows/watch-vibration-poc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Handy-APKs bauen und Alarmkalender prüfen
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK 35 installieren
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Sanftwecker und Benachrichtigungs-PoC bauen und testen
        run: |
          gradle --no-daemon -p experiments/watch-vibration-poc \
            :alarm:testDebugUnitTest :alarm:assembleDebug :phone:assembleDebug
      - name: Nur die beiden Handy-APKs bereitstellen
        shell: bash
        run: |
          mkdir -p artifacts
          cp experiments/watch-vibration-poc/alarm/build/outputs/apk/debug/alarm-debug.apk artifacts/sanftwecker-preview-debug.apk
          cp experiments/watch-vibration-poc/phone/build/outputs/apk/debug/phone-debug.apk artifacts/watch-notification-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sanftwecker-preview-apk
          path: artifacts/sanftwecker-preview-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: watch-notification-poc-apk
          path: artifacts/watch-notification-debug.apk
          if-no-files-found: error
          retention-days: 14
