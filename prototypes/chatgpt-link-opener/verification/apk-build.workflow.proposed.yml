name: Android-Link-Öffner APK testen

# VORSCHLAG, KEIN AKTIVER WORKFLOW. Muss vor Aktivierung separat geprüft werden.
# Falls freigegeben, als .github/workflows/chat-link-opener-apk.yml übernehmen.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'prototypes/chatgpt-link-opener/**'
      - '.github/workflows/chat-link-opener-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Quellen laden
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Java 17 bereitstellen
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9 bereitstellen
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android-SDK bereitstellen
        uses: android-actions/setup-android@v3
      - name: Android 35 installieren
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Debug-APK bauen
        working-directory: prototypes/chatgpt-link-opener
        run: gradle --no-daemon :app:assembleDebug
      - name: Public Fingerprint und assetlinks.json erzeugen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification-output
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey \
            | grep 'SHA256:' | head -1 | sed -E 's/.*SHA256: *//' > verification-output/cert-sha256.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          fingerprint = Path('verification-output/cert-sha256.txt').read_text().strip()
          document = [{'relation': ['delegate_permission/common.handle_all_urls'],
                       'target': {'namespace': 'android_app',
                                  'package_name': 'io.github.cobrachris.chatlinkopener',
                                  'sha256_cert_fingerprints': [fingerprint]}}]
          Path('verification-output/assetlinks.json').write_text(json.dumps(document, indent=2) + '\n')
          PY
      - name: APK und Verifizierungsdatei bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: android-link-opener-debug
          retention-days: 7
          path: |
            prototypes/chatgpt-link-opener/app/build/outputs/apk/debug/app-debug.apk
            verification-output/assetlinks.json
            verification-output/cert-sha256.txt

# Achtung: Eine neue CI-Instanz kann einen anderen Debug-Signaturschluessel erzeugen.
# Die erzeugte assetlinks.json MUSS zur exakt heruntergeladenen APK passen.
# Die GitHub-Pages-Root-Site existiert noch nicht und wird hier nicht angelegt.
# GitHub-Actions-Sicherheitsreview und Freigabe bleiben erforderlich.